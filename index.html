<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Rekod Kenderaan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Sistem Rekod Kenderaan</h1>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Cari No Kenderaan / No Siri Stiker / No Blok">
            <button id="searchBtn">Cari</button>
        </div>
        <div id="resultContainer">
            <table id="resultTable">
                <thead>
                    <tr>
                        <th>No Siri Stiker</th>
                        <th>No Kereta</th>
                        <th>Blok</th>
                        <th>No Rumah</th>
                        <th>No Fon</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Hasil carian akan dipaparkan di sini -->
                </tbody>
            </table>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
