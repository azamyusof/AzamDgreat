<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Semakan Ahli PEJUANG - Bulk IC Checker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    body { background: #f8f9fa; padding: 2rem; }
    .form-inline input { margin-bottom: 0.5rem; }
    .manual-entry-row input { margin-right: 0.5rem; }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="mb-4 text-center">Semakan Ahli PEJUANG</h2>
    <!-- Upload Excel XLSX -->
    <div class="mb-4">
      <h5>1. Upload Senarai Excel (.xlsx)</h5>
      <input type="file" id="excelFile" accept=".xlsx,.xls" class="form-control" />
      <button class="btn btn-primary mt-2" onclick="processExcel()">Semak dari Fail Excel</button>
    </div>
    <hr />
    <!-- Manual Input -->
    <div class="mb-4">
      <h5>2. Masukkan Nama & MyKad Secara Manual (hingga 20)</h5>
      <div id="manualEntries"></div>
      <button class="btn btn-secondary my-2" onclick="addRow()">+ Tambah Baris</button>
      <button class="btn btn-primary" onclick="processManual()">Semak Manual</button>
    </div>
    <hr />
    <!-- Result Table -->
    <div>
      <h5>Hasil Semakan:</h5>
      <table class="table table-bordered" id="resultTable">
        <thead>
          <tr>
            <th>#</th>
            <th>Nama Diberi</th>
            <th>MyKad</th>
            <th>Nama Penuh</th>
            <th>No. Ahli</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <button class="btn btn-success mt-3" onclick="downloadExcel()">📥 Muat Turun Excel</button>
    </div>
  </div>
  <script>
    // Add a new row for manual input
    function addRow() {
      const container = document.getElementById('manualEntries');
      const currentRows = container.querySelectorAll('.manual-entry-row').length;
      if (currentRows >= 20) return alert('Maksimum 20 baris dibenarkan');
      const div = document.createElement('div');
      div.classList.add('manual-entry-row');
      div.innerHTML = `<input type="text" placeholder="Nama" class="form-control d-inline-block" style="width:45%" />
                      <input type="text" placeholder="MyKad" class="form-control d-inline-block" style="width:45%" />`;
      container.appendChild(div);
    }

// Clear the results table
    function clearResults() {
      document.querySelector('#resultTable tbody').innerHTML = '';
    }

// Fetch membership details from the API
    async function semakIC(nama, mykad, index) {
      try {
        const response = await fetch(`/api?mykad=${mykad}`);

        if (!response.ok) {
          throw new Error(`HTTP error! Status: ${response.status}`);
        }

        const data = await response.json();

        let namaPenuh = data.nama_penuh || '-';
        let noAhli = data.no_ahli || '-';

        renderRow(index + 1, nama, mykad, namaPenuh, noAhli);
      } catch (err) {
        console.error(`Error semakIC: ${mykad}`, err);
        renderRow(index + 1, nama, mykad, '-', 'Ralat');
      }
    }

// Render a row in the results table
    function renderRow(index, nama, mykad, namaPenuh, noAhli) {
      const tbody = document.querySelector('#resultTable tbody');
      const row = document.createElement('tr');
      row.innerHTML = `<td>${index}</td>
                      <td>${nama}</td>
                      <td>${mykad}</td>
                      <td>${namaPenuh}</td>
                      <td>${noAhli}</td>`;
      tbody.appendChild(row);
    }

// Process manual inputs
    function processManual() {
      clearResults();
      const rows = document.querySelectorAll('.manual-entry-row');
      rows.forEach((row, i) => {
        const inputs = row.querySelectorAll('input');
        const nama = inputs[0].value.trim();
        const mykad = inputs[1].value.trim();
        if (mykad) semakIC(nama, mykad, i);
      });
    }

// Process Excel file inputs
    function processExcel() {
      clearResults();
      const file = document.getElementById('excelFile').files[0];
      if (!file) return alert('Sila pilih fail Excel dahulu.');

const reader = new FileReader();
      reader.onload = function (e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const sheetName = workbook.SheetNames[0];
        const sheet = workbook.Sheets[sheetName];
        const json = XLSX.utils.sheet_to_json(sheet);

json.forEach((row, i) => {
          const keys = Object.keys(row).reduce((acc, key) => {
            acc[key.toLowerCase()] = row[key];
            return acc;
          }, {});
          const nama = keys['nama'] || keys['name'] || '-';
          const mykad = keys['mykad'] || keys['ic'] || '';
          if (mykad) semakIC(nama, mykad, i);
        });
      };
      reader.readAsArrayBuffer(file);
    }

// Download results as an Excel file
    function downloadExcel() {
      const rows = Array.from(document.querySelectorAll('#resultTable tbody tr')).map(tr => {
        const cells = tr.querySelectorAll('td');
        return {
          '#': cells[0].innerText,
          'Nama Diberi': cells[1].innerText,
          'MyKad': cells[2].innerText,
          'Nama Penuh': cells[3].innerText,
          'No. Ahli': cells[4].innerText
        };
      });

const worksheet = XLSX.utils.json_to_sheet(rows);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, 'Semakan');
      XLSX.writeFile(workbook, 'hasil_semakan_pejuang.xlsx');
    }
  </script>
</body>
</html>
